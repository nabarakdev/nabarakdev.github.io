<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Executed regression tests in the educational example</title><desc id="desc">Baseline: one passing and three failing tests. After the fix: four passing and zero failing tests. Synthetic fixture only, not business impact.</desc><rect width="1000" height="360" fill="#111720"/><g font-family="Arial,sans-serif" fill="#edf3fc"><text x="46" y="48" font-size="13" letter-spacing="2">EXECUTED EDUCATIONAL EXAMPLE / DEMO-001</text><text x="46" y="91" font-size="27">Same four scenarios. Before and after.</text><text x="46" y="152" font-size="17">Baseline</text><text x="46" y="228" font-size="17">Fixed</text><rect x="212" y="125" width="165" height="39" fill="#86c4ff"/><rect x="377" y="125" width="495" height="39" fill="#d59a7b"/><rect x="212" y="201" width="660" height="39" fill="#86c4ff"/><g fill="#101820" font-size="15"><text x="231" y="150">1 passed</text><text x="396" y="150">3 failed</text><text x="231" y="226">4 passed · 0 failed</text></g><text x="46" y="294" fill="#a5b3c7" font-size="14">Real Node.js test execution on a synthetic fixture. No coverage or enterprise speed-up claim.</text><text x="46" y="327" fill="#a5b3c7" font-size="12">Reproduce: node cases/agentic-delivery/demo/run.mjs --approve-implementation</text></g></svg>
